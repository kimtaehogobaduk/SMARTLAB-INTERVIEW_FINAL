<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="200" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Tech Grid Background Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.8">
    <line x1="120" y1="0" x2="120" y2="200" />
    <line x1="240" y1="0" x2="240" y2="200" />
    <line x1="360" y1="0" x2="360" y2="200" />
    <line x1="480" y1="0" x2="480" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
    <line x1="720" y1="0" x2="720" y2="200" />
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
  </g>

  <!-- Glowing Aura behind Logo Icon -->
  <circle cx="110" cy="100" r="60" fill="url(#glow-grad)" filter="url(#glow)"/>

  <!-- Logo Icon: Futuristic Hexagonal Shield & AI Waveform -->
  <g transform="translate(45, 35)" filter="url(#soft-shadow)">
    <!-- Hexagon Outer Border -->
    <polygon points="65,10 120,40 120,95 65,125 10,95 10,40" fill="#0f172a" stroke="url(#primary-grad)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Inner Neural Hub / Speech Waveform Lines -->
    <path d="M 35 68 L 45 68 L 50 50 L 55 85 L 60 40 L 65 95 L 70 55 L 75 80 L 80 62 L 85 72 L 95 68" 
          fill="none" stroke="url(#accent-cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central AI Core Node -->
    <circle cx="65" cy="68" r="4.5" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="65" cy="68" r="2.5" fill="#38bdf8"/>
    
    <!-- Corner Tech Nodes -->
    <circle cx="65" cy="10" r="3" fill="#6366f1"/>
    <circle cx="120" cy="40" r="3" fill="#8b5cf6"/>
    <circle cx="120" cy="95" r="3" fill="#38bdf8"/>
    <circle cx="65" cy="125" r="3" fill="#06b6d4"/>
    <circle cx="10" cy="95" r="3" fill="#3b82f6"/>
    <circle cx="10" cy="40" r="3" fill="#6366f1"/>
  </g>

  <!-- Typography & Branding Header -->
  <g transform="translate(195, 0)">
    <!-- Badge / Category Pill -->
    <g transform="translate(0, 38)">
      <rect width="210" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="11" r="3.5" fill="#10b981"/>
      <text x="24" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">NEXT-GEN INTERVIEW AI</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="98" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      SMART<tspan fill="url(#primary-grad)">LAB</tspan>
      <tspan fill="#94a3b8" font-weight="300" font-size="28"> AI Studio</tspan>
    </text>

    <!-- Subtitle & Club Identity -->
    <text x="0" y="128" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.5">
      상산고등학교 No.1 코딩 &amp; 소프트웨어 공학 동아리
    </text>
    
    <text x="0" y="152" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      실시간 음성 STT • 독립 블라인드 채점 • AI 꼬리질문 생성 • 다자간 합의 심사 플랫폼
    </text>
  </g>

  <!-- Right Accent Elements -->
  <g transform="translate(710, 45)" opacity="0.7">
    <rect x="0" y="0" width="45" height="110" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="22.5" cy="22" r="6" fill="#10b981" opacity="0.9"/>
    <circle cx="22.5" cy="55" r="6" fill="#38bdf8" opacity="0.9"/>
    <circle cx="22.5" cy="88" r="6" fill="#818cf8" opacity="0.9"/>
  </g>
</svg>
